[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-dev-loop"
version = "1.0.0a5"
description = "Turn an LLM into a gated, sandboxed, resumable construction loop over your codebase."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Luke Wilson" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    # Base install = workflow mode (core + viz + workflow CLI). Deliberately
    # dependency-light (TS-1 / NFR-4.1 / BR-2): pydantic + PyYAML only. The
    # heavy OpenHands-SDK engine deps live in the [engine] extra below.
    "pydantic>=2.0",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/lukedawilson/agentic-dev-loop"

[project.scripts]
agentic-dev-loop = "agentic_dev_loop.engine.cli:main"
agentic-dev-loop-workflow = "agentic_dev_loop.workflow.cli:main"
agentic-dev-loop-commit = "agentic_dev_loop.engine.commit_shim:main"

[project.optional-dependencies]
engine = [
    "openhands-sdk ~=1.17.0",
    "openhands-tools ~=1.17.0",
    # openhands-sdk declares agent-client-protocol>=0.8.1 with NO upper bound;
    # the 1.0.0rc pre-releases drop acp.helpers (breaks sdk 1.17.0 imports).
    # Without this cap, --pre installs resolve to the broken rc. See AGENTS.md
    # error-handling rules + COMPAT-SHIMS.md for the SDK-compat pattern.
    "agent-client-protocol<1.0.0",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.0",
]
# Workflow mode is the BASE install — this empty extra exists only so
# `pip install agentic-dev-loop[workflow]` reads naturally and pulls nothing
# beyond the light base (core + viz). See README / NFR-4.1.
workflow = []
dev = [
    "agentic-dev-loop[engine]",
    "hypothesis>=6.0",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentic_dev_loop = ["py.typed"]
"agentic_dev_loop.core" = ["workflow.js.template"]

[tool.pytest.ini_options]
markers = [
    "docker: real-Docker integration tests (require a running Linux daemon)",
]
