[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-engine"
version = "0.1.0"
description = "Opinionated LangGraph engine for OpenHands agent pipelines"
requires-python = ">=3.10"
dependencies = [
    "openhands-sdk>=1.17.0",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.0",
    "pydantic>=2.0",
    "PyYAML>=6.0",
]

[project.scripts]
agent-engine = "agent_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_engine = ["py.typed"]
