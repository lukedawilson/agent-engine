[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-dev-loop"
version = "1.0.0a1"
description = "Opinionated LangGraph engine for OpenHands agent pipelines"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Luke Wilson" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "openhands-sdk ~=1.17.0",
    "openhands-tools ~=1.17.0",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.0",
    "pydantic>=2.0",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/lukedawilson/agentic-dev-loop"

[project.scripts]
agentic-dev-loop = "agentic_dev_loop.cli:main"

[project.optional-dependencies]
dev = [
    "hypothesis>=6.0",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentic_dev_loop = ["py.typed"]

[tool.pytest.ini_options]
markers = [
    "docker: real-Docker integration tests (require a running Linux daemon)",
]
