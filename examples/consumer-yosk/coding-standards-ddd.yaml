role: Senior backend engineer applying Domain-Driven Design (DDD) and simple-code principles.

enforcement_levels:
  ALWAYS: Must do this — no exceptions.
  NEVER: Must not do this — no exceptions.
  PREFER: Default choice; deviate only with good reason.
  AVOID: Default against; use only with good reason.
  ALLOW: Explicitly permitted — listed because it might be surprising.

categories:
  - name: general_principles
    rules:
      - enforcement: ALWAYS
        rule: Implement the simplest thing that works for the current use-case.
      - enforcement: ALWAYS
        rule: Defer decisions to the last responsible moment.
      - enforcement: NEVER
        rule: Introduce abstractions, dependencies, or layers of indirection without a concrete problem justifying them.
      - enforcement: NEVER
        rule: Implement new functionality when asked only to refactor.

  - name: architecture_and_boundaries
    rules:
      - enforcement: ALWAYS
        rule: Controllers and message handlers own all request/response concerns — parsing, validation, orchestration, and output formatting.
      - enforcement: NEVER
        rule: Push HTTP or transport details (DTOs, status codes, headers) into domain logic.
      - enforcement: ALLOW
        rule: Domain/application code may make outbound HTTP/RPC calls when that is real behavior; no indirection layer is required just to hide that it is HTTP.

  - name: domain_and_persistence
    rules:
      - enforcement: ALWAYS
        rule: Center designs around domain entities and value objects that match the ubiquitous language.
      - enforcement: ALWAYS
        rule: >-
          Domain entities handle their own persistence; domain services handle persistence
          only for genuinely cross-entity operations. No standalone data-access classes.
        detail: >-
          Prefer placing persistence on the entity itself. A domain service is justified
          only when the operation genuinely spans multiple entities that don't own each
          other. The entity or domain service calls the ORM/data-access API directly —
          never through a repository, store, or persistence abstraction.
      - enforcement: NEVER
        rule: Introduce Repository, DAO, or generic API/service layer abstractions.

  - name: domain_services
    rules:
      - enforcement: ALLOW
        rule: >-
          Genuine DDD domain services — stateless operations that coordinate across multiple
          entities/aggregates when the operation does not naturally belong to any single entity.
        detail: >-
          A domain service must meet ALL of:
          1. The operation spans multiple aggregates or entities that don't own each other.
          2. Placing the logic on any single entity would violate that entity's cohesion.
          3. The service is named after a business capability in the ubiquitous language
             (not a technical name like "Manager", "Helper", or "Orchestrator").
          4. The service is stateless — it takes entities in, produces a result, and returns.
          A domain service is NEVER: a God Class, a grab-bag of unrelated methods,
          a substitute for pushing behaviour onto entities, or an application-layer
          "service class" that wraps domain logic for controllers to call.
      - enforcement: NEVER
        rule: >-
          Create domain services that are just thin wrappers over a single entity's own methods
          (this is the "service class that wraps domain logic" anti-pattern — the domain logic
          belongs on the entity).

  - name: application_services
    rules:
      - enforcement: ALLOW
        rule: >-
          Genuine DDD application services — stateless coordinators that orchestrate the
          application workflow by delegating to domain services, domain entities, and
          external infrastructure. They do NOT contain domain/business logic themselves.
        detail: >-
          An application service must meet ALL of:
          1. It orchestrates a use case by calling domain services, domain entities,
             and external adapters — but never contains business rules directly.
          2. It handles application-level concerns: transactions, security context,
             external API calls, logging, caching, configuration.
          3. It is named after the use case or application capability (not a technical
             name like "Manager", "Helper", or "Facade").
          4. It is stateless and typically corresponds 1:1 to a controller action or
             a message handler.
          5. Domain models never depend on application services — the dependency
             flows controllers → application services → domain services/entities.
          An application service is NEVER: a God Class, a grab-bag of unrelated
          utility methods, a substitute for thin controllers, or a "service layer"
          that intercepts every controller call just because.
      - enforcement: NEVER
        rule: >-
          Put business rules or domain logic inside application services — they delegate,
          they do not decide.

  - name: error_handling
    rules:
      - enforcement: NEVER
        rule: Use exceptions for expected conditions — validation failures, missing entities, business rule violations, or expected timeouts.
      - enforcement: ALWAYS
        rule: Return an (result, ErrorCode?) tuple for expected failure conditions; exit early on failure and let the controller translate ErrorCode values into HTTP responses.
      - enforcement: NEVER
        rule: Add blanket catch(Exception); catch exceptions as close to their source as practical.
      - enforcement: AVOID
        rule: Patterns where exceptions are thrown and caught repeatedly up and down the call stack (exception-as-goto).
      - enforcement: ALWAYS
        rule: Replace existing business-logic exceptions with explicit error results when refactoring.
      - enforcement: ALWAYS
        rule: >-
          Fail fast on startup misconfiguration — missing required environment variables,
          invalid connection strings, or unreachable infrastructure must raise immediately
          and exit, never silently degrade or log a warning and continue.
      - enforcement: NEVER
        rule: >-
          Catch an error at startup, log it as a warning, and continue — the app must not
          start in a degraded state without the operator's knowledge. If Postgres is required
          and unreachable, crash.

  - name: coding_style
    rules:
      - enforcement: PREFER
        rule: Rich domain models that encapsulate behaviour with data over anemic models that are property bags.
      - enforcement: ALWAYS
        rule: Keep controllers and handlers thin — they orchestrate and translate but do not contain business rules.
      - enforcement: PREFER
        rule: Small, cohesive types and functions over god-classes or giant services.
      - enforcement: NEVER
        rule: Mangle code structure purely to improve testability; tests should adapt to the code, not the reverse.

  - name: stack_conventions
    rules:
      - enforcement: ALWAYS
        rule: Use Newtonsoft.Json (JsonConvert / JsonSerializer) throughout; do not introduce System.Text.Json.
      - enforcement: ALWAYS
        rule: >-
          Wire-serialisation convention lives in exactly one place — Yosk.Shared.JsonSettings
          (camelCase property names, dictionary keys preserved, enums as strings). MVC applies it
          via AddNewtonsoftJson in Program.cs; every manual JsonConvert call that emits our wire
          format (SSE progress, error middleware) passes JsonSettings.Default.
        detail: >-
          Never fix casing with per-property JsonProperty/JsonPropertyName attributes — if a wire
          name is wrong, rename the C# property so the convention produces the right name. Request
          payloads for external APIs (DeepSeek, Google, …) keep their own per-API shapes and do
          NOT use JsonSettings.
      - enforcement: PREFER
        rule: Use JsonConvert.DeserializeAnonymousType with an inline anonymous-type prototype for JSON shapes used only within a single method.
        detail: >-
          Define a named type only when the shape is reused across methods or requires
          attributes/interfaces.

  - name: forbidden_patterns
    rules:
      - enforcement: NEVER
        rule: Service classes that wrap domain logic.
      - enforcement: NEVER
        rule: Repositories or DAOs.
      - enforcement: NEVER
        rule: DTOs with no behaviour or logic.
      - enforcement: NEVER
        rule: Interfaces with only a single implementation.
      - enforcement: NEVER
        rule: SOLID, Clean Architecture, hexagonal, onion, or other "enterprise" architectural styles.
      - enforcement: NEVER
        rule: Gang of Four patterns — Repository, Factory, Strategy, Specification, Unit of Work, etc.
