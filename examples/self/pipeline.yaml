name: agent-engine-construction

extensions:
  - agent_engine.extensions.aidlc:AidlcExtension   # bundled; loading IS choosing

additional_files:                    # top-level, standalone, optional
  - ../../README.md                  # resolved relative to the pipeline file's dir;
                                     # listed-but-missing → fail fast

llm:
  model: openai/deepseek-v4-pro
  base_url: https://api.deepseek.com
  api_key_env: OPENAI_API_KEY
  extra_body: { chat_template_kwargs: { thinking: false } }
  # timeout omitted → opinionated no-timeout default

state_dir: .pr
max_attempts: 10                     # CLI --max-attempts overrides
agents_dir: sdk_agents               # resolved relative to the pipeline file's dir

steps:
  - name: dev
    agent: dev
    produces: implementation-summary.md   # hygiene-tracked, no verdict
    on_pass: checks

  - name: checks
    agent: checks
    artifact: ci-fix.md
    verdicts: { pass: PASS, fail: FAIL }
    on_pass: review
    on_fail: { goto: dev, retry: true }

  - name: review
    agent: review
    artifact: review-findings.md
    verdicts: { pass: APPROVED, fail: NEEDS CHANGES }
    on_pass: port_sweep
    on_fail: { goto: dev, retry: true }

  - name: port_sweep
    action: kill_listeners
    params: { port: 8321, match: agent-engine }  # sweep an orphaned --viz server
    on_pass: qa

  - name: qa
    agent: qa
    artifact: qa-report.md
    verdicts: { pass: PASS, fail: FAIL }
    max_iterations: 200
    on_pass: commit
    on_fail: { goto: dev, retry: true }

  - name: commit
    action: commit
    params: { message: "feat: construct {subject} (agent dev loop)" }
    on_pass: success
