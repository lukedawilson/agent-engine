name: publish-image

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "Dockerfile"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/lukedawilson/agentic-dev-loop/dev:latest
      - name: Report digest for pinning
        run: |
          echo "Pinned digest for DEFAULT_DEV_IMAGE_REF (paste into src/agentic_dev_loop/isolation.py):"
          echo "ghcr.io/lukedawilson/agentic-dev-loop/dev@${{ steps.build.outputs.digest }}"
