name: publish-image

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "Dockerfile"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/lukedawilson/agentic-dev-loop/dev:latest
      - name: Report digest for pinning
        run: |
          DIGEST=$(docker buildx imagetools inspect ghcr.io/lukedawilson/agentic-dev-loop/dev:latest --format '{{.Manifest.Digest}}')
          echo "Published platforms:"
          docker buildx imagetools inspect ghcr.io/lukedawilson/agentic-dev-loop/dev:latest --format '{{range .Manifest.Manifests}}  - {{.Platform.OS}}/{{.Platform.Architecture}}{{println}}{{end}}'
          echo ""
          echo "Pinned digest for DEFAULT_DEV_IMAGE_REF (paste into src/agentic_dev_loop/isolation.py):"
          echo "ghcr.io/lukedawilson/agentic-dev-loop/dev@${DIGEST}"
