name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit + PBT (no Docker)
        run: pytest tests/ -m "not docker" -q
      - name: Prepare Docker (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "DockerDesktop.exe" | Out-Null
          # Start Docker Desktop and wait for the engine (Linux containers mode)
          Start-Process "C:\Program Files\Docker\Docker\Docker Desktop.exe"
          $deadline = (Get-Date).AddMinutes(5)
          do {
            Start-Sleep -Seconds 10
            docker version --format '{{.Server.APIVersion}}' 2>$null
          } while ($LASTEXITCODE -ne 0 -and (Get-Date) -lt $deadline)
          if ($LASTEXITCODE -ne 0) { throw "Docker Desktop did not start" }
      - name: Prepare integration image
        run: docker pull python:3.12
      - name: Docker integration tests
        run: pytest tests/ -m docker -q
