name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit + PBT (no Docker)
        run: pytest tests/ -m "not docker" -q
      # Docker integration tests run on Linux only: GitHub-hosted Windows
      # runners ship the Docker CLI but no daemon (no Docker Desktop, no
      # nested virtualisation), so containers cannot run there.
      - name: Prepare integration image
        if: runner.os == 'Linux'
        run: docker pull python:3.12
      - name: Docker integration tests
        if: runner.os == 'Linux'
        run: pytest tests/ -m docker -q
